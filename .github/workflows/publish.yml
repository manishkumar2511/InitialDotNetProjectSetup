name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack InitialDotNetProjectSetup.Package/InitialDotNetProjectSetup.Package.csproj -c Release -o out

      - name: Push to NuGet (Trusted Publishing)
        run: dotnet nuget push out/*.nupkg --api-key none --source https://api.nuget.org/v3/index.json --skip-duplicate